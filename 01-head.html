<style>
/* ============ TOKENS ============ */
:root{
  --bg:#FAFAF8; --bg-2:#F3F2EE; --bg-3:#EBE9E3; --card:#FFFFFF;
  --ink:#171717; --ink-2:#45443F; --ink-3:#65645E;
  --line:#E5E3DD; --line-2:#D2CFC6;
  --blue:#315EFB; --blue-hi:#4A73FF; --blue-lo:#2348D8; --blue-50:#EEF2FF; --blue-100:#DCE4FF; --blue-ink:#2246D1;
  --orange:#E89B62; --orange-50:#FCF2EA; --orange-100:#F7DFCB; --orange-ink:#8A4718;
  --on-accent:#FFFFFF;
  --grad-primary:linear-gradient(180deg,var(--blue-hi),var(--blue));
  --grad-primary-hover:linear-gradient(180deg,#5C82FF,var(--blue-hi));
  --grad-primary-active:linear-gradient(180deg,var(--blue),var(--blue-lo));
  --r-sm:6px; --r:10px; --r-lg:14px; --r-xl:20px; --r-2xl:28px;
  --sh-card:0 1px 1px 0 rgb(0 0 0/.05);
  --sh-sm:0 1px 2px 0 rgb(0 0 0/.06),0 1px 3px 0 rgb(0 0 0/.10);
  --sh-md:0 2px 4px -1px rgb(0 0 0/.06),0 4px 6px -1px rgb(0 0 0/.10);
  --sh-lg:0 4px 6px -2px rgb(0 0 0/.05),0 10px 15px -3px rgb(0 0 0/.10);
  --sh-pop:0 1px 1px 0 rgb(0 0 0/.04),0 8px 24px -6px rgb(0 0 0/.14);
  --font-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1); --ease-std:cubic-bezier(.4,0,.2,1);
  --pad:clamp(20px,4vw,56px); --maxw:1440px;
  --sec:clamp(4.5rem,2.5rem + 6vw,9rem);
  --nav-h:68px;
  --focus:var(--blue);
  color-scheme:light;
}
.dark{
  --bg:#121212; --bg-2:#1A1A19; --bg-3:#242422; --card:#1C1C1B;
  --ink:#F4F4F0; --ink-2:#CFCEC8; --ink-3:#A3A29C;
  --line:#2B2B29; --line-2:#3B3B38;
  --blue:#7A97FF; --blue-hi:#8FA8FF; --blue-lo:#5F80F5; --blue-50:#1A2246; --blue-100:#243063; --blue-ink:#A9BCFF;
  --orange:#E89B62; --orange-50:#2E2018; --orange-100:#45301F; --orange-ink:#F2BC92;
  --on-accent:#0B0F1F;
  --sh-card:0 1px 1px 0 rgb(0 0 0/.14);
  --sh-sm:0 1px 2px 0 rgb(0 0 0/.12),0 1px 3px 0 rgb(0 0 0/.16);
  --sh-md:0 2px 4px -1px rgb(0 0 0/.12),0 4px 6px -1px rgb(0 0 0/.18);
  --sh-pop:0 1px 1px 0 rgb(0 0 0/.14),0 8px 24px -6px rgb(0 0 0/.5);
  color-scheme:dark;
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + 24px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:1.0625rem;line-height:1.6;
  font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-kerning:normal;
  font-variant-ligatures:common-ligatures contextual;overflow-x:clip}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.18em}
p{margin:0 0 1em}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p,li{text-wrap:pretty}
ul,ol{margin:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
::selection{background:var(--blue-100)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:500;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}

/* ============ TYPE STYLES ============ */
.t-display{font-weight:800;font-size:clamp(4.6rem,.6rem + 18.5vw,19rem);line-height:.8;letter-spacing:-.055em;text-transform:uppercase}
.t-hero{font-weight:700;font-size:clamp(2.6rem,1.3rem + 5.6vw,7.25rem);line-height:.96;letter-spacing:-.04em}
.t-h1{font-weight:650;font-size:clamp(2.5rem,1.45rem + 4.4vw,6rem);line-height:1;letter-spacing:-.037em}
.t-h2{font-weight:620;font-size:clamp(2rem,1.35rem + 2.7vw,4rem);line-height:1.04;letter-spacing:-.032em}
.t-h3{font-weight:600;font-size:clamp(1.375rem,1.2rem + .75vw,1.875rem);line-height:1.18;letter-spacing:-.02em}
.t-h4{font-weight:600;font-size:1.125rem;line-height:1.35;letter-spacing:-.008em}
.t-lead{font-size:clamp(1.125rem,1rem + .55vw,1.4rem);line-height:1.5;color:var(--ink-2);letter-spacing:-.005em}
.t-body{font-size:1.0625rem;line-height:1.6}
.t-sm{font-size:.9375rem;line-height:1.55}
.t-xs{font-size:.8125rem;line-height:1.45}
.t-label{font-family:var(--font-mono);font-size:.75rem;line-height:1.3;text-transform:uppercase;letter-spacing:.08em;font-weight:500;color:var(--ink-3)}
.serif{font-family:var(--font-serif);font-weight:400;letter-spacing:-.01em}
.serif-i{font-family:var(--font-serif);font-style:italic;font-weight:400;letter-spacing:-.012em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.measure{max-width:62ch} .measure-n{max-width:46ch} .measure-w{max-width:72ch}
.blue{color:var(--blue)} .orange-ink{color:var(--orange-ink)}
.caps-statement{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.9}

/* ============ LAYOUT ============ */
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
.sec{padding-block:var(--sec)}
.sec-sm{padding-block:clamp(3rem,2rem + 3vw,5.5rem)}
.sec + .sec.tight-top{padding-top:0}
.rule{border-top:1px solid var(--line)}
.grid{display:grid;gap:clamp(16px,2vw,28px)}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack>*+*{margin-top:var(--gap,16px)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sec-head{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:clamp(16px,2vw,28px);margin-bottom:clamp(2rem,1.2rem + 2.5vw,4rem)}
.sec-head .t-label{padding-top:.6em}
.sec-head h2{margin-bottom:.5em}
.sec-head .t-lead{max-width:56ch}
@media (max-width:860px){
  .g-3,.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec-head{grid-template-columns:1fr;gap:12px}
  .sec-head .t-label{padding-top:0}
}
@media (max-width:600px){
  .g-2,.g-3,.g-4{grid-template-columns:1fr}
}
@media (max-width:860px){.g-12>*{grid-column:1/-1!important}}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:80;height:var(--nav-h);background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:650;letter-spacing:-.02em;font-size:1rem}
.brand-svg{height:26px;width:auto;color:var(--ink);overflow:visible;flex:none}
.brand-svg .bm-dot{fill:var(--blue);transform-box:fill-box;transform-origin:center;transition:transform .4s var(--ease-out)}
.brand:hover .bm-dot{transform:scale(1.25)}
.brand{gap:12px}
.brand-div{width:1px;height:26px;background:var(--line-2);flex:none}
.brand-nm{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}
.brand-nm b{font-size:.9375rem;font-weight:650;letter-spacing:-.02em}
.brand-nm small{font-family:var(--font-mono);font-size:.625rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
@media (min-width:1061px) and (max-width:1279px){.brand-nm small{display:none}}
@media (max-width:479px){.nav .brand-div,.nav .brand-nm{display:none}}
.foot-brand .brand-svg{height:34px;color:#F4F4F0}
.foot-brand .bm-dot{fill:var(--blue-hi)}
.jv-ava .brand-svg{height:16px;color:#171717}
.jv-ava .bm-dot{fill:#315EFB}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.75rem;font-weight:700;letter-spacing:0;position:relative}
.brand-mark::after{content:"";position:absolute;right:5px;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.nav-links{display:flex;align-items:center;gap:2px;list-style:none}
.nav-links a{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:.875rem;font-weight:500;color:var(--ink-2);transition:color .15s,background-color .15s}
.nav-links a:hover{color:var(--ink);background:var(--bg-3)}
.nav-links a[aria-current="page"]{color:var(--ink);background:var(--bg-3)}
.nav-cta{display:flex;align-items:center;gap:8px}
.menu-btn{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);place-items:center}
.mb-bars{display:flex;flex-direction:column;gap:5px;width:18px}
.mb-bars i{display:block;width:18px;height:1.5px;border-radius:2px;background:var(--ink);transition:transform .3s var(--ease-out)}
.menu-btn[aria-expanded="true"] .mb-bars i:first-child{transform:translateY(3.25px) rotate(45deg)}
.menu-btn[aria-expanded="true"] .mb-bars i:last-child{transform:translateY(-3.25px) rotate(-45deg)}
.mnav{position:fixed;inset:var(--nav-h) 0 0 0;z-index:79;background:var(--bg);padding:24px var(--pad) 40px;overflow:auto;
  opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s var(--ease-out),transform .35s var(--ease-out),visibility 0s .35s}
.mnav.open{opacity:1;visibility:visible;transform:none;transition:opacity .25s var(--ease-out),transform .35s var(--ease-out)}
.mnav ul{list-style:none}
.mnav li a{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:clamp(1.6rem,6vw,2.2rem);font-weight:600;letter-spacing:-.03em}
.mnav li a small{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-3);font-weight:400;letter-spacing:.04em}
.mnav li a[aria-current="page"]{color:var(--blue)}
.mnav .sub a{font-size:1.125rem;padding:12px 0 12px 16px;font-weight:500;letter-spacing:-.01em}
@media (max-width:1060px){.nav-links{display:none}.menu-btn{display:grid}}
@media (min-width:1061px){.mnav{display:none}}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r);
  font-size:.9375rem;font-weight:500;letter-spacing:.005em;line-height:1;text-decoration:none;white-space:nowrap;
  transition:box-shadow .15s ease,color .15s ease,border-color .15s ease,background-color .15s ease,transform .42s var(--ease-std)}
.btn:active{transform:scale(.98);transition-duration:.15s,.15s,.15s,.15s,.22s}
.btn-primary{position:relative;isolation:isolate;background-image:var(--grad-primary);color:var(--on-accent);box-shadow:var(--sh-sm),inset 0 1px 0 rgb(255 255 255/.18)}
.btn-primary::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background-image:var(--grad-primary-hover);opacity:0;transition:opacity .15s ease;pointer-events:none}
.btn-primary:hover::before{opacity:1}
.btn-primary:active{background-image:var(--grad-primary-active)}
.btn-primary:active::before{opacity:0}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ink:hover{background:color-mix(in srgb,var(--ink) 86%,var(--blue))}
.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--sh-card)}
.btn-secondary:hover{border-color:var(--ink-3)}
.btn-ghost{background:var(--blue-50);color:var(--blue-ink)}
.btn-ghost:hover{background:var(--blue-100)}
.btn-sm{min-height:36px;padding:8px 12px;font-size:.8125rem;border-radius:8px}
.btn-icon{width:36px;min-height:36px;padding:0;border-radius:8px}
.arrow{display:inline-block;transition:transform .3s var(--ease-out)}
a:hover .arrow,button:hover .arrow{transform:translateX(3px)}
.link{color:var(--blue-ink);font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.link:hover{text-decoration-color:currentColor}

/* ============ TAGS / STATUS ============ */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-family:var(--font-mono);font-size:.6875rem;
  letter-spacing:.04em;text-transform:uppercase;font-weight:500;white-space:nowrap;border:1px solid transparent;line-height:1}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag-done{background:var(--blue-50);color:var(--blue-ink);border-color:var(--blue-100)}
.tag-research{background:var(--bg-2);color:var(--ink-2);border-color:var(--line-2)}
.tag-rec{background:var(--card);color:var(--ink);border-color:var(--ink-3)}
.tag-concept{background:var(--orange-50);color:var(--orange-ink);border:1px dashed var(--orange)}
.tag-ongoing{background:var(--orange-50);color:var(--orange-ink);border-color:var(--orange-100)}
.tag-ongoing::before{animation:pulse 2s var(--ease-io) infinite}
.tag-upcoming{background:var(--card);color:var(--ink-2);border:1px dashed var(--ink-3)}
.tag-ambition{background:transparent;color:var(--ink-3);border:1px dotted var(--ink-3)}
.tag-illus{background:repeating-linear-gradient(135deg,var(--bg-2) 0 6px,var(--bg-3) 6px 12px);color:var(--ink-2);border-color:var(--line-2)}
.tag-hyp{background:var(--card);color:var(--orange-ink);border:1px dashed var(--orange-ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ph{display:inline;background:var(--orange-50);color:var(--orange-ink);border:1px dashed var(--orange);border-radius:6px;padding:.05em .4em;font-family:var(--font-mono);font-size:.82em;letter-spacing:.01em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}

/* ============ CARDS / PANELS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,2vw,26px);box-shadow:var(--sh-card)}
.card h3,.card h4{margin-bottom:.4em}
.card p:last-child{margin-bottom:0}
.card-link{display:block;text-decoration:none;transition:border-color .2s,box-shadow .2s,transform .4s var(--ease-out)}
.card-link:hover{border-color:var(--line-2);box-shadow:var(--sh-md);transform:translateY(-2px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,2vw,28px)}
.note{border-left:2px solid var(--orange);background:var(--orange-50);padding:14px 18px;border-radius:0 var(--r) var(--r) 0;font-size:.9375rem;line-height:1.55;color:var(--ink-2)}
.note strong{color:var(--ink)}
.kicker{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.kicker .num{font-family:var(--font-mono);font-size:.75rem;color:var(--blue-ink)}
.divider-label{display:flex;align-items:center;gap:14px}
.divider-label::after{content:"";flex:1;height:1px;background:var(--line)}
.evidence{aspect-ratio:4/3;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);display:grid;place-items:center;text-align:center;padding:20px;
  background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--bg-3) 60%,transparent) 10px 11px);color:var(--ink-3)}
.evidence .ph{font-size:.75rem}
.quote{font-family:var(--font-serif);font-size:clamp(1.75rem,1.2rem + 2.2vw,3.25rem);line-height:1.1;letter-spacing:-.015em}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
dl.kv dt{font-family:var(--font-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding-top:.25em}
dl.kv dd{margin:0}
.list-dash{list-style:none}
.list-dash li{position:relative;padding-left:18px;margin-bottom:.45em}
.list-dash li::before{content:"";position:absolute;left:0;top:.75em;width:8px;height:1px;background:var(--ink-3)}

/* ============ REVEAL MOTION ============ */
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease-out),transform .8s var(--ease-out)}
.rv.in{opacity:1;transform:none}
.line-rv{display:block;opacity:0;transform:translateY(12px);filter:blur(3px);animation:lineIn .7s var(--ease-out) forwards}
@keyframes lineIn{to{opacity:1;transform:none;filter:none}}
.page-enter{animation:pageIn .45s var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ HERO ============ */
.hero{padding-top:clamp(2rem,1rem + 4vw,5rem);padding-bottom:clamp(3rem,2rem + 4vw,6rem);position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:clamp(2rem,1rem + 4vw,5rem)}
.hero-name{font-size:clamp(1.1rem,.9rem + .8vw,1.5rem);font-weight:700;letter-spacing:-.02em}
.hero-statement .t-hero{display:block}
.hero-statement .invade{display:block;margin-top:.04em;margin-left:-.04em;color:var(--ink);position:relative}
.invade .dot{color:var(--blue)}
.hero-foot{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,3vw,48px);margin-top:clamp(2rem,1rem + 3vw,4rem);align-items:end}
@media (max-width:860px){.hero-foot{grid-template-columns:1fr}}
.meta-strip{display:flex;flex-wrap:wrap;gap:6px 18px}
.meta-strip span{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

.invade-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.invade-grid>*{background:var(--card);padding:clamp(18px,2vw,28px)}
.invade-grid .n{font-family:var(--font-mono);font-size:.75rem;color:var(--blue-ink);margin-bottom:28px;display:block}
@media (max-width:860px){.invade-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.invade-grid{grid-template-columns:1fr}}

.bfds{background:var(--ink);color:var(--bg);border-radius:var(--r-2xl);padding:clamp(28px,4vw,64px);position:relative;overflow:hidden}
.bfds .caps-statement{font-size:clamp(2.6rem,1rem + 7vw,8rem);line-height:.96}
.bfds .caps-statement .second{color:color-mix(in srgb,var(--bg) 38%,var(--ink))}

/* lenses */
.lenses{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:28px}
.lens{border:1px solid rgb(255 255 255/.16);border-radius:var(--r);padding:14px;text-align:left;min-height:44px;transition:background-color .2s,border-color .2s;color:inherit}
.lens:hover{border-color:rgb(255 255 255/.4)}
.lens[aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.lens .t-label{color:inherit;opacity:.7}
.lens-out{margin-top:20px;min-height:3.4em;font-size:clamp(1.05rem,1rem + .3vw,1.25rem);line-height:1.5;max-width:62ch;color:color-mix(in srgb,var(--bg) 85%,var(--ink))}
@media (max-width:860px){.lenses{grid-template-columns:repeat(2,minmax(0,1fr))}.lenses .lens:last-child{grid-column:1/-1}}

/* VMB */
.vmb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
.vmb>div{padding:28px clamp(0px,2vw,28px) 8px 0;border-right:1px solid var(--line)}
.vmb>div+div{padding-left:clamp(16px,2vw,28px)}
.vmb>div:last-child{border-right:0}
.vmb .quote{font-size:clamp(1.5rem,1.1rem + 1.3vw,2.3rem);margin-top:14px}
@media (max-width:860px){.vmb{grid-template-columns:1fr}.vmb>div{border-right:0;border-bottom:1px solid var(--line);padding:24px 0}.vmb>div+div{padding-left:0}}

/* work cards */
.work-card{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0;border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;background:var(--card);text-decoration:none;transition:box-shadow .3s,border-color .3s,transform .5s var(--ease-out)}
.work-card:hover{box-shadow:var(--sh-lg);border-color:var(--line-2);transform:translateY(-3px)}
.work-card .wc-body{padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:14px}
.work-card .wc-art{min-height:260px;position:relative;overflow:hidden;border-left:1px solid var(--line)}
.work-card .wc-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
@media (max-width:860px){.work-card{grid-template-columns:1fr}.work-card .wc-art{border-left:0;border-top:1px solid var(--line);min-height:200px;order:-1}}
.art-unilever{background:var(--blue-50);background-image:linear-gradient(var(--blue-100) 1px,transparent 1px),linear-gradient(90deg,var(--blue-100) 1px,transparent 1px);background-size:24px 24px}
.art-clique{background:var(--orange-50)}
.art-hydra{background:#141414}
.art-svg{position:absolute;inset:0;width:100%;height:100%}


/* ============ HERO HEADLINE ============ */
.hero-h{--big:min(20rem,calc((min(100vw,var(--maxw)) - 2 * var(--pad)) / 4.45));margin:clamp(.5rem,2vw,2rem) 0 0;font-weight:800;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hh-1{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:clamp(10px,1.4vw,22px);border-bottom:1px solid var(--line-2);margin-bottom:clamp(10px,1.4vw,22px)}
.hh-l1{font-size:clamp(1.6rem,.8rem + 3.4vw,4.75rem);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--ink-3);white-space:nowrap;opacity:0;transform:translateY(10px);transition:opacity .6s var(--ease-out),transform .7s var(--ease-out)}
.hh-strike{position:relative;color:var(--ink-2);transition:color .5s ease .95s}
.hh-strike::after{content:"";position:absolute;left:-3%;right:-3%;top:47%;height:.12em;border-radius:99px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease-io) .6s}
.hh-note{font-family:var(--font-mono);font-weight:500;font-size:.75rem;letter-spacing:.07em;color:var(--ink-3);text-align:right;max-width:24ch;line-height:1.5;opacity:0;transition:opacity .6s ease 1.6s}
.hh-2{display:block;font-size:var(--big);line-height:.8;letter-spacing:-.058em;word-spacing:.1em;white-space:nowrap;margin-left:-.045em}
.hh-mark{position:relative;display:inline-block;z-index:0;opacity:0;transform:translateY(18%);filter:blur(6px);transition:opacity .7s var(--ease-out) 1s,transform .9s var(--ease-out) 1s,filter .7s var(--ease-out) 1s}
.hh-mark::before{content:"";position:absolute;z-index:-1;left:.02em;right:-.04em;bottom:.03em;height:.2em;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease-io) 1.55s}
.hh-ex{display:inline-block;color:var(--blue);margin-left:.02em;opacity:0;transform:translateY(-30%) rotate(8deg);transition:opacity .4s ease 1.9s,transform .6s cubic-bezier(.34,1.56,.64,1) 1.9s}
.hero-h.played .hh-l1,.hero-h.played .hh-mark,.hero-h.played .hh-ex{opacity:1;transform:none;filter:none}
.hero-h.played .hh-note{opacity:1}
.hero-h.played .hh-strike{color:var(--ink-3)}
.hero-h.played .hh-strike::after,.hero-h.played .hh-mark::before{transform:scaleX(1)}
@media (max-width:700px){.hh-note{display:none}.hh-1{border-bottom:0;padding-bottom:0;margin-bottom:6px}}

/* ============ MARQUEE ============ */
.marquee{position:relative;overflow:hidden;border-block:1px solid var(--line);padding:clamp(14px,1.6vw,22px) 0;background:var(--card)}
.mq-track{display:flex;width:max-content;animation:mq 46s linear infinite}
.mq-row{display:flex;align-items:center;flex:none}
.mq-row span{font-size:clamp(1.5rem,1rem + 2vw,2.9rem);font-weight:650;letter-spacing:-.035em;line-height:1.1;white-space:nowrap;padding-inline:clamp(14px,1.6vw,26px)}
.mq-row span:nth-of-type(even){font-family:var(--font-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--ink-2)}
.mq-row i{font-style:normal;color:var(--blue);font-size:clamp(.9rem,.7rem + .6vw,1.3rem)}
.marquee:hover .mq-track,.marquee.paused .mq-track,.marquee:focus-within .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-height:32px;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);font-family:var(--font-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);opacity:0;transition:opacity .2s}
.marquee:hover .mq-btn,.mq-btn:focus-visible,.marquee.paused .mq-btn{opacity:1}
@media (hover:none){.mq-btn{opacity:1}}

/* ============ SCANNER ============ */
.scan{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;background:var(--card);box-shadow:var(--sh-card)}
.scan-steps{display:flex;flex-direction:column;border-right:1px solid var(--line)}
.scan-step{position:relative;display:grid;grid-template-columns:auto 1fr;column-gap:16px;text-align:left;padding:clamp(18px,2vw,26px) clamp(18px,2vw,28px);border-bottom:1px solid var(--line);flex:1;align-content:center;transition:background-color .25s}
.scan-step:last-child{border-bottom:0}
.scan-step:hover{background:var(--bg-2)}
.scan-step .n{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-3);padding-top:.45em;transition:color .2s}
.scan-step .tt{font-size:clamp(1.125rem,1rem + .5vw,1.5rem);font-weight:600;letter-spacing:-.02em;line-height:1.25;color:var(--ink-3);transition:color .25s}
.scan-step .dd{grid-column:2;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease-out)}
.scan-step .dd>span{overflow:hidden;font-size:.9375rem;line-height:1.5;color:var(--ink-2)}
.scan-step[aria-selected="true"]{background:var(--bg-2)}
.scan-step[aria-selected="true"] .tt{color:var(--ink)}
.scan-step[aria-selected="true"] .n{color:var(--blue-ink)}
.scan-step[aria-selected="true"] .dd{grid-template-rows:1fr}
.scan-step[aria-selected="true"] .dd>span{padding-top:6px}
.scan-step .bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue);transform:scaleX(0);transform-origin:left}
.scan-step[aria-selected="true"] .bar{transform:scaleX(1)}
.scan-step.run .bar{animation:scanbar 3.6s linear}
@keyframes scanbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.scan-vis{padding:clamp(18px,2.5vw,32px);display:flex;flex-direction:column;gap:16px;background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:20px 20px}
.scan-grid{position:relative;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:clamp(3px,.45vw,6px)}
.scan-grid .c{aspect-ratio:1;border-radius:clamp(2px,.3vw,5px);background:var(--bg-3);transition:background-color .45s ease var(--d),box-shadow .45s ease var(--d),opacity .45s ease var(--d),transform .5s var(--ease-out) var(--d)}
.scan-grid .c.srv{background:color-mix(in srgb,var(--ink) 22%,var(--card))}
.scan-grid .c.gap{background:var(--bg-3);opacity:1}
.scan[data-s="1"] .c.need,.scan[data-s="2"] .c.need,.scan[data-s="3"] .c.need{background:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 25%,transparent)}
.scan[data-s="2"] .c.gap,.scan[data-s="3"] .c.gap{background:var(--blue-50);opacity:1;box-shadow:inset 0 0 0 1.5px var(--blue)}
.scan[data-s="2"] .c.srv:not(.need){opacity:.55}
.scan[data-s="3"] .c.srv{opacity:.3}
.scan[data-s="3"] .c.need{opacity:.6}
.scan[data-s="3"] .c.entry{background:var(--blue);transform:scale(1.18);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 25%,transparent),var(--sh-md);z-index:1}
.scan-pin,.scan-zone{position:absolute;transform:translate(-50%,calc(-100% - 10px));padding:5px 9px;border-radius:999px;background:var(--blue);color:var(--on-accent);font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s,transform .45s var(--ease-out);z-index:2}
.scan-zone{transform:translate(-50%,4px);background:var(--card);color:var(--blue-ink);border:1px dashed var(--blue)}
.scan[data-s="3"] .scan-pin{opacity:1;transform:translate(-50%,calc(-100% - 14px))}
.scan[data-s="2"] .scan-zone{opacity:1;transform:translate(-50%,0)}
.scan-cap{min-height:5.6em}
.scan-cap p{margin:6px 0 0;font-size:clamp(1rem,.95rem + .3vw,1.2rem);line-height:1.45;max-width:52ch}
.scan-how{margin:0;font-size:.9375rem;color:var(--ink-2);padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.scan-how b{color:var(--ink)}
.scan-ex .chip{min-height:34px}
.scan-stats{display:flex;flex-wrap:wrap;gap:8px}
.scan-stats span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.875rem}
.scan-stats b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue-ink)}
.scan-key span{padding:4px 8px;border-radius:999px;transition:background-color .2s,color .2s}
.scan-key span.on{background:var(--ink);color:var(--bg)}
.scan-arrow{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;opacity:0;transition:opacity .4s}
.scan-arrow .sa-line{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:6 5;fill:none}
.scan[data-s="3"] .scan-arrow{opacity:1}
.scan[data-s="3"] .scan-arrow .sa-line{animation:dashMove 1s linear infinite}
@keyframes dashMove{to{stroke-dashoffset:-11}}
.scan-key{display:flex;flex-wrap:wrap;gap:6px 8px;color:var(--ink-2);font-size:.8125rem}
.scan-key span{display:inline-flex;align-items:center;gap:6px}
.scan-key .k{width:12px;height:12px;border-radius:3px;display:inline-block;background:color-mix(in srgb,var(--ink) 22%,var(--card))}
.scan-key .k.need{background:var(--orange)}.scan-key .k.gap{background:var(--blue-50);box-shadow:inset 0 0 0 1.5px var(--blue)}.scan-key .k.entry{background:var(--blue)}
@media (max-width:860px){.scan{grid-template-columns:1fr}.scan-steps{border-right:0;border-bottom:1px solid var(--line);order:2}.scan-step .dd{display:none}.scan-steps{display:grid;grid-template-columns:1fr 1fr}.scan-step{border-right:1px solid var(--line)}.scan-step:nth-child(2n){border-right:0}.scan-step:nth-child(3){border-bottom:0}.scan-step .tt{font-size:1rem}}

/* ============ CAROUSEL ============ */
:root{--edge:max(var(--pad),calc((100vw - var(--maxw)) / 2 + var(--pad)))}
.car-track{display:grid;grid-auto-flow:column;grid-auto-columns:var(--slide);gap:clamp(12px,1.4vw,20px);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:var(--edge);padding:6px var(--edge) 22px;scrollbar-width:none;cursor:grab}
.car-track::-webkit-scrollbar{display:none}
.car-track:focus-visible{outline-offset:-4px}
.car-track.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
.car-track.dragging a{pointer-events:none}
.car-track a,.car-track img{-webkit-user-drag:none}
.car-slide{scroll-snap-align:start;min-width:0;display:flex}
.car-slide>*{flex:1}
.car-foot{display:flex;align-items:center;gap:16px}
.car-prog{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.car-prog span{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(.04);transition:transform .15s linear}
.car-foot .btn:disabled{opacity:.35;cursor:default}
.car-work{--slide:min(1040px,82vw)}
.car-work .work-card{height:100%;min-height:clamp(380px,34vw,460px)}
.car-work .car-slide{transition:opacity .4s ease}
.car-work .car-slide:not(.is-active){opacity:.55}
.car-work .car-slide:hover{opacity:1}
@media (max-width:860px){.car-work{--slide:86vw}.car-work .car-slide:not(.is-active){opacity:1}}
.wc-dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wc-dark .t-label{color:#A3A29C}.wc-dark .wc-art{border-color:#2B2B29}
.art-dd{background:#1C1C1B;display:grid;place-items:center;overflow:hidden}
.dd-mini{font-weight:800;font-size:clamp(2.6rem,1rem + 4vw,5rem);letter-spacing:-.06em;text-transform:uppercase;color:#F4F4F0;line-height:.85}
.dd-mini b{color:var(--orange);font-weight:800}
.art-next{display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--bg-2) 0 12px,var(--bg) 12px 24px)}
.art-next span{font-size:clamp(2rem,1.2rem + 2.4vw,3.6rem);color:var(--ink-3)}
.car-journey{--slide:clamp(250px,24vw,330px)}
.jr-card{display:flex;flex-direction:column;gap:10px;min-height:clamp(320px,26vw,380px);padding:clamp(20px,2vw,28px);border-radius:var(--r-xl);border:1px solid var(--line);background:var(--card);text-decoration:none;position:relative;transition:border-color .2s,box-shadow .3s,transform .5s var(--ease-out)}
.jr-card:hover{border-color:var(--line-2);box-shadow:var(--sh-md);transform:translateY(-3px)}
.jr-i{position:absolute;top:clamp(20px,2vw,28px);right:clamp(20px,2vw,28px)}
.jr-when{font-size:clamp(2.2rem,1.6rem + 1.6vw,3.2rem);line-height:1;color:var(--ink);margin-top:24px}
.jr-line{display:block;height:1px;background:var(--line-2);margin:14px 0 6px;position:relative}
.jr-line::before{content:"";position:absolute;left:0;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.jr-card h3{margin:0}
.jr-card p{color:var(--ink-2);margin:0}
.jr-tag{margin-top:auto}
.jr-now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jr-now .jr-when{color:var(--bg)}.jr-now p{color:#CFCEC8}.jr-now .jr-line{background:#3B3B38}.jr-now .t-label{color:#A3A29C}

@media (max-width:1100px){.car-foot .btn,.scan-play,.mq-btn{min-height:44px;min-width:44px}}

/* ============ HOW I THOUGHT ============ */
.cs-standout{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:12px;padding:clamp(18px,2vw,26px);border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card)}
.cs-standout>div{flex:1 1 420px}
.cs-standout p{margin:8px 0 0;font-size:clamp(1rem,.95rem + .3vw,1.2rem);line-height:1.5;color:var(--ink);max-width:70ch}
.theme-hydra .cs-standout{background:#1A1A19;border-color:#2B2B29}
.theme-hydra .cs-standout p{color:#F4F4F0}.theme-hydra .cs-standout .t-label{color:#A3A29C}
.standout{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(20px,3vw,48px);padding:clamp(22px,3vw,40px);border-radius:var(--r-xl);background:var(--ink);color:var(--bg);margin-bottom:16px}
.standout .t-label{color:#A3A29C}
.standout-t{font-family:var(--font-serif);font-size:clamp(1.5rem,1.1rem + 1.3vw,2.35rem);line-height:1.15;letter-spacing:-.012em;margin:14px 0 0}
.standout-pts{display:grid;gap:18px;align-content:start}
.standout-pts>div{border-top:1px solid #3B3B38;padding-top:14px}
.standout-pts h4{margin:6px 0 4px;color:var(--bg)}
.standout-pts p{color:#CFCEC8!important;margin:0}
.standout-pts .t-label{color:var(--blue-hi)!important}
@media (max-width:860px){.standout{grid-template-columns:1fr}}
.tk-intro{color:var(--ink-2);margin-bottom:18px;max-width:60ch}
.pattern{list-style:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;counter-reset:p}
.pattern li{position:relative;padding:0 14px 0 0;display:flex;flex-direction:column;gap:6px}
.pattern li::before{content:"";position:absolute;left:34px;right:0;top:15px;height:1.5px;background:var(--blue-100)}
.pattern li:last-child::before{display:none}
.pattern .pn{width:30px;height:30px;border-radius:50%;background:var(--blue);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-mono);font-size:.6875rem;margin-bottom:8px;position:relative}
.pattern strong{font-size:1.0625rem;letter-spacing:-.01em}
.pattern span:last-child{font-size:.875rem;line-height:1.45;color:var(--ink-2)}
@media (max-width:900px){.pattern{grid-template-columns:1fr;gap:14px}.pattern li{display:grid;grid-template-columns:30px 1fr;column-gap:14px;padding:0}.pattern li::before{left:14px;top:34px;bottom:-14px;right:auto;width:1.5px;height:auto}.pattern .pn{grid-row:1/3;margin:0}}
.tq{border-top:1px solid var(--line)}
.tq:last-child{border-bottom:1px solid var(--line)}
.tq summary{display:flex;gap:16px;align-items:baseline;padding:16px 4px;cursor:pointer;list-style:none;min-height:44px}
.tq summary::-webkit-details-marker{display:none}
.tq summary::after{content:"+";margin-left:auto;font-family:var(--font-mono);color:var(--ink-3);transition:transform .25s}
.tq[open] summary::after{transform:rotate(45deg)}

/* ============ ASSISTANT OF JV ============ */
.jvbot{position:fixed;right:clamp(14px,2vw,28px);bottom:clamp(14px,2vw,28px);z-index:95;font-family:var(--font-sans)}
.jvbot.menu-open{display:none}
.jv-launch{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 18px 8px 8px;border-radius:999px;background:var(--ink);color:#F4F4F0;box-shadow:0 10px 30px -8px rgb(0 0 0/.35),0 2px 6px rgb(0 0 0/.12);font-size:.875rem;transition:transform .4s var(--ease-out),box-shadow .3s}
.jv-launch:hover{transform:translateY(-2px);box-shadow:0 14px 34px -8px rgb(0 0 0/.4)}
.jv-launch b{font-weight:600}
.jv-ava{width:38px;height:38px;border-radius:50%;background:#FAFAF8;display:grid;place-items:center;flex:none}

.jv-panel{width:min(400px,calc(100vw - 28px));height:min(600px,calc(100vh - 110px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px -16px rgb(0 0 0/.35),0 2px 8px rgb(0 0 0/.08);overflow:hidden;animation:jvIn .35s var(--ease-out)}
.jv-panel[hidden]{display:none}
@keyframes jvIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.jv-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:var(--ink);color:#F4F4F0}
.jv-head h2{font-size:1rem;font-weight:650;letter-spacing:-.01em;margin:0}
.jv-head p{margin:0;font-size:.75rem;color:#A3A29C;display:flex;align-items:center;gap:6px}
.jv-dot{width:7px;height:7px;border-radius:50%;background:#3DDC84}
.jv-x{margin-left:auto;width:40px;height:40px;border-radius:12px;color:#F4F4F0;font-size:1.5rem;line-height:1}
.jv-x:hover{background:#2B2B29}
.jv-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);overscroll-behavior:contain}
.jv-msg{display:flex;flex-direction:column;gap:6px;max-width:88%;animation:fpIn .35s var(--ease-out)}
.jv-msg.me{align-self:flex-end;align-items:flex-end}
.jv-bub{padding:10px 14px;border-radius:16px 16px 16px 6px;background:var(--card);border:1px solid var(--line);font-size:.9rem;line-height:1.5;color:var(--ink)}
.jv-bub b{font-weight:600}
.jv-msg.me .jv-bub{background:var(--blue);color:#fff;border-color:var(--blue);border-radius:16px 16px 6px 16px}
.jv-links{display:flex;flex-wrap:wrap;gap:6px}
.jv-link{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:6px 12px;border-radius:999px;background:var(--blue-50);color:var(--blue-ink);font-size:.8125rem;font-weight:500;text-decoration:none;border:1px solid var(--blue-100)}
.jv-link:hover{background:var(--blue-100)}
.jv-typing .jv-bub{display:flex;gap:4px;padding:14px}
.jv-typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:jvDot 1s infinite ease-in-out}
.jv-typing i:nth-child(2){animation-delay:.15s}.jv-typing i:nth-child(3){animation-delay:.3s}
@keyframes jvDot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.jv-chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-top:1px solid var(--line);scrollbar-width:none;background:var(--card)}

.jv-chips button{flex:none;min-height:34px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:.8125rem;font-weight:500;background:var(--card);white-space:nowrap}
.jv-chips button:hover{border-color:var(--ink-3)}
.jv-form{display:flex;gap:8px;padding:0 12px 10px;background:var(--card)}
.jv-in{flex:1;height:44px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;font-size:.9375rem;background:var(--bg);min-width:0}
.jv-in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.jv-send{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-size:1.1rem}

@media (max-width:640px){

}

/* ============ UPCOMING: blink ============ */
.tag-upcoming{animation:upGlow 1.6s ease-in-out infinite}
.tag-upcoming::before{animation:upBlink 1s steps(2,jump-none) infinite;background:var(--blue)}

.tag-ambition{animation:ambGlow 1.6s ease-in-out infinite}
.tag-ambition::before{animation:upBlink 1s steps(2,jump-none) infinite;background:var(--orange)}
@keyframes ambGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--orange) 0%,transparent);color:var(--ink-3);border-color:var(--ink-3)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange-ink);border-color:var(--orange)}}
@keyframes upBlink{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
@keyframes upGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 0%,transparent);border-color:var(--ink-3)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent);border-color:var(--blue)}}

.scqa-c{padding:clamp(16px,2vw,24px);display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);position:relative}

.scqa-c:not(:last-child)::after{content:"→";position:absolute;right:-9px;top:22px;width:18px;height:18px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:.6875rem;color:var(--blue-ink);z-index:1}
.scqa-l{font-family:var(--font-serif);font-size:2.2rem;line-height:1;color:var(--blue)}
.scqa-c p{margin:0;font-size:.9375rem;line-height:1.5;color:var(--ink-2)}
.scqa-c .tag{margin-top:auto;align-self:flex-start}
@media (max-width:900px){.scqa{grid-template-columns:1fr 1fr}.scqa-c:nth-child(2){border-right:0}.scqa-c:nth-child(-n+2){border-bottom:1px solid var(--line)}.scqa-c::after{display:none}}
@media (max-width:520px){.scqa{grid-template-columns:1fr}.scqa-c{border-right:0;border-bottom:1px solid var(--line)}}
.an{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0}
.an-fig{position:relative;background:var(--bg-2);border-right:1px solid var(--line);padding:18px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px}
.an-fig svg{width:100%;max-width:340px;margin:0 auto;height:auto}
.an-spots{position:absolute;inset:18px;max-width:340px;margin:0 auto}
.an-body{fill:var(--card);stroke:var(--ink);stroke-width:2.4}
.an-fill{fill:var(--blue-50);stroke:none}
.an-part{fill:var(--card);stroke:var(--ink);stroke-width:2.2}
.an-thread{stroke:var(--ink-3);stroke-width:1.4;fill:none}
.an-chamber{fill:var(--bg-3);stroke:var(--ink);stroke-width:1.6}
.an-spring{fill:none;stroke:var(--orange-ink);stroke-width:2;stroke-linejoin:round}
.an-tube{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.an-disc{fill:var(--blue);stroke:none}
.an-up{stroke:var(--blue);stroke-width:2;fill:none;stroke-linecap:round}
.an-valve{fill:var(--orange)}
.an-vent{stroke:var(--ink-3);stroke-width:2;stroke-dasharray:3 4}
.an-dot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--font-mono);font-size:.75rem;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg-2);transition:background-color .2s,transform .2s}
.an-dot:hover{transform:translate(-50%,-50%) scale(1.1)}
.an-dot[aria-pressed="true"]{background:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 30%,transparent)}
.an-out{padding:clamp(18px,2.5vw,32px)}
.an-out p{color:var(--ink-2);max-width:52ch}
.an-list{list-style:none;display:grid;gap:4px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.an-list button{width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:.875rem;min-height:36px}
.an-list button:hover{background:var(--bg-2)}
.an-list li.on button{background:var(--blue-50);color:var(--blue-ink);font-weight:600}
@media (max-width:760px){.an{grid-template-columns:1fr}.an-fig{border-right:0;border-bottom:1px solid var(--line)}}
.hyp-tbl{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.hyp-h,.hyp-r{display:grid;grid-template-columns:48px minmax(0,3fr) minmax(0,2.4fr) minmax(0,3fr) 130px;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start;font-size:.875rem}
.hyp-h{background:var(--bg-2);font-family:var(--font-mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.hyp-r:last-child{border-bottom:0}
.hyp-r span{color:var(--ink-2)}
.hyp-n{font-family:var(--font-serif);font-size:1.6rem;line-height:1;color:var(--orange-ink)!important}
@media (max-width:860px){.hyp-h{display:none}.hyp-r{grid-template-columns:1fr;gap:6px}}
.op-wrap{overflow-x:auto}
table.op{width:100%;border-collapse:collapse;min-width:720px;font-size:.875rem}
.op th,.op td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:center}
.op thead th{background:var(--bg-2);font-weight:500;font-size:.75rem;color:var(--ink-3)}
.op tbody th{text-align:left;font-weight:600}
.op tbody tr{cursor:pointer;transition:background-color .15s}
.op tbody tr:hover{background:var(--bg-2)}
.op tbody tr.on{background:var(--blue-50)}
.op tbody tr.op-us th{color:var(--orange-ink)}
.op-d{letter-spacing:3px;color:var(--blue);font-size:.75rem}.op-d i{font-style:normal;color:var(--line-2)}
.gl{border-top:1px solid var(--line);padding:8px 0}
.gl:first-of-type{margin-top:10px}
.gl summary{cursor:pointer;font-weight:600;font-size:.9375rem;list-style:none;display:flex;justify-content:space-between;min-height:32px;align-items:center}
.gl summary::-webkit-details-marker{display:none}
.gl summary::after{content:"+";font-family:var(--font-mono);color:var(--ink-3)}
.gl[open] summary::after{content:"−"}
.gl p{margin:4px 0 4px;font-size:.875rem;color:var(--ink-2)}

/* ============ PAGE HEADERS ============ */
.phead{padding-top:clamp(2.5rem,1.5rem + 4vw,6rem);padding-bottom:clamp(2.5rem,1.5rem + 3vw,5rem)}
.phead .t-label{margin-bottom:22px;display:block}
.phead .t-lead{margin-top:clamp(1.25rem,1rem + 1vw,2rem);max-width:58ch}
.crumbs{display:flex;gap:8px;align-items:center;font-size:.8125rem;color:var(--ink-3);margin-bottom:22px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--ink-2)} .crumbs a:hover{color:var(--blue-ink)}

/* ============ CASE STUDY LAYOUT ============ */
.cs-hero{padding-top:clamp(2rem,1rem + 3vw,4.5rem);padding-bottom:clamp(2.5rem,1.5rem + 3vw,4.5rem)}
.cs-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:clamp(2rem,1rem + 3vw,3.5rem)}
.cs-meta>div{background:var(--card);padding:16px 18px}
.cs-meta .t-label{display:block;margin-bottom:6px}
.cs-meta p{margin:0;font-size:.9375rem;line-height:1.45;font-weight:500}
@media (max-width:860px){.cs-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cs-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:start}
.cs-layout>*{min-width:0}
.cs-toc{position:sticky;top:calc(var(--nav-h) + 24px)}
.cs-toc ol{list-style:none;counter-reset:toc}
.cs-toc li{counter-increment:toc}
.cs-toc button{display:flex;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:.875rem;color:var(--ink-3);transition:color .15s,background-color .15s;min-height:34px;align-items:center}
.cs-toc button::before{content:counter(toc,decimal-leading-zero);font-family:var(--font-mono);font-size:.6875rem;width:18px;flex:none}
.cs-toc button:hover{color:var(--ink);background:var(--bg-2)}
.cs-toc button.active{color:var(--ink);background:var(--bg-3);font-weight:500}
.cs-toc button.active::before{color:var(--blue-ink)}
.cs-sec{padding-block:clamp(3rem,2rem + 3vw,5.5rem);border-top:1px solid var(--line)}
.cs-sec:first-child{border-top:0;padding-top:0}
.cs-sec>header{margin-bottom:clamp(1.5rem,1rem + 1.5vw,2.5rem)}
.cs-sec>header .t-label{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.cs-sec>header .t-label b{color:var(--blue-ink);font-weight:500}
.cs-sec h2{font-size:clamp(1.75rem,1.3rem + 1.8vw,3rem);line-height:1.08;letter-spacing:-.03em;font-weight:620;max-width:24ch}
.cs-sec .t-lead{margin-top:14px;max-width:60ch}
.cs-sec h3{margin:2.2em 0 .7em}
.cs-sec h3:first-child{margin-top:0}
.cs-sec .card h3,.cs-sec .split h3,.cs-sec .prod h3{margin:0 0 .4em}
[tabindex="-1"]:focus{outline:none}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2.4em 0 1em}
.subhead h3{margin:0}
@media (max-width:1060px){
  .cs-layout{grid-template-columns:1fr}
  .cs-toc{top:var(--nav-h);z-index:20;margin-inline:calc(var(--pad) * -1);padding:10px var(--pad);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .cs-toc ol{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .cs-toc ol::-webkit-scrollbar{display:none}
  .cs-toc li{flex:none;scroll-snap-align:start}
  .cs-toc button{white-space:nowrap;width:auto;min-height:36px}
  .cs-toc .toc-title{display:none}
}
.cs-next{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cs-next a{padding:24px;border:1px solid var(--line);border-radius:var(--r-lg);text-decoration:none;background:var(--card);transition:border-color .2s,box-shadow .2s}
.cs-next a:hover{border-color:var(--line-2);box-shadow:var(--sh-md)}
.cs-next a:last-child{text-align:right}
@media (max-width:600px){.cs-next{grid-template-columns:1fr}.cs-next a:last-child{text-align:left}}

/* Case themes */
.theme-unilever .cs-hero{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.theme-unilever .cs-hero .wrap{position:relative}
.theme-clique .cs-hero{background:linear-gradient(180deg,var(--orange-50),var(--bg))}
.theme-hydra .cs-hero{background:#121212;color:#F4F4F0}
.theme-hydra .cs-meta{background:#2B2B29;border-color:#2B2B29}
.theme-hydra .cs-meta>div{background:#1A1A19;color:#F4F4F0}
.theme-hydra .cs-meta .t-label,.theme-hydra .crumbs,.theme-hydra .crumbs a{color:#A3A29C}
.theme-hydra .crumbs a:hover{color:#fff}

/* contribution split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split>div{border-radius:var(--r-lg);padding:clamp(18px,2vw,28px);border:1px solid var(--line);background:var(--card)}
.split .is-real{border-color:var(--blue-100);background:linear-gradient(180deg,var(--blue-50),var(--card) 60%)}
.split .is-vision{border:1px dashed var(--orange);background:linear-gradient(180deg,var(--orange-50),var(--card) 60%)}
@media (max-width:700px){.split{grid-template-columns:1fr}}

/* ============ WIDGET CHROME ============ */
.widget{position:relative;margin-block:clamp(1rem,.8rem + 1vw,1.75rem)}
.w-frame{position:relative;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);overflow:hidden;box-shadow:var(--sh-card)}
.w-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap}
.w-bar .t-label{color:var(--ink-2)}
.w-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.w-tools .btn-sm{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card)}
.w-tools .btn-sm:hover{border-color:var(--line-2)}
.w-tools .btn-sm[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.w-hint{font-size:.75rem;color:var(--ink-3);padding:10px 18px;border-top:1px solid var(--line);background:var(--bg-2);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.w-body{padding:clamp(16px,2vw,24px)}

/* viewport (pan/zoom) */
.vp{position:relative;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;background-image:radial-gradient(circle,var(--line-2) 1px,transparent 1.2px);background-size:22px 22px}
.vp.zoomed{touch-action:none}
.vp.dragging{cursor:grabbing}
.vp-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.vp-stage.anim{transition:transform .45s var(--ease-out)}
.vp-edges{position:absolute;inset:0;overflow:visible;pointer-events:none}

/* graph nodes */
.g-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;max-width:170px;padding:10px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--line-2);box-shadow:var(--sh-sm);font-size:.875rem;font-weight:600;line-height:1.2;text-align:center;letter-spacing:-.005em;
  transition:opacity .25s,border-color .2s,box-shadow .2s,background-color .2s,color .2s;min-height:44px;justify-content:center;white-space:normal}
.g-node small{font-weight:400;font-size:.6875rem;color:var(--ink-3);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase}
.g-node:hover{border-color:var(--ink-3)}
.g-node.hub{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:.9375rem;padding:14px 18px}
.g-node.hub small{color:color-mix(in srgb,var(--bg) 60%,var(--ink))}
.g-node.c-blue{border-color:var(--blue-100);background:var(--blue-50);color:var(--blue-ink)}
.g-node.c-orange{border-color:var(--orange);border-style:dashed;background:var(--orange-50);color:var(--orange-ink)}
.g-node.active{background:var(--blue);color:var(--on-accent);border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 22%,transparent),var(--sh-md)}
.g-node.active small{color:inherit;opacity:.8}
.g-node.dim{opacity:.28}
.g-edge{fill:none;stroke:var(--line-2);stroke-width:1.5;transition:stroke .25s,opacity .25s,stroke-width .25s}
.g-edge.dash{stroke-dasharray:4 4}
.g-edge.on{stroke:var(--blue);stroke-width:2}
.g-edge.dim{opacity:.15}
.g-elabel{font-family:var(--font-mono);font-size:11px;fill:var(--ink-3);paint-order:stroke;stroke:var(--card);stroke-width:4px;transition:opacity .25s}
.g-elabel.on{fill:var(--blue-ink)}
.g-elabel.dim{opacity:.15}
@media (max-width:640px){.g-node{max-width:118px;font-size:.75rem;padding:8px 10px;border-radius:10px}.g-node.hub{font-size:.8125rem;padding:10px 12px}.g-node small{font-size:.625rem}}
.g-panel{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:18px;border-top:1px solid var(--line);min-height:120px}
.g-panel h4{font-size:1.0625rem}
.g-panel p{margin:0;color:var(--ink-2);font-size:.9375rem;max-width:70ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:.8125rem;font-weight:500;transition:background-color .15s,color .15s,border-color .15s;line-height:1.2}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"],.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;background:var(--bg-2);font-size:.8125rem;font-weight:500;color:var(--ink-2)}
.chips-row{padding:12px 18px;border-top:1px solid var(--line);background:var(--bg-2)}
.g-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* mind map */
.mm-node{position:absolute;transform:translateY(-50%);display:flex;align-items:center;gap:8px;max-width:190px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line-2);
  font-size:.8125rem;line-height:1.25;font-weight:500;text-align:left;box-shadow:var(--sh-card);min-height:36px;transition:border-color .2s,background-color .2s,box-shadow .2s,opacity .3s}
.mm-node:hover{border-color:var(--ink-3)}
.mm-node.root{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:650;font-size:.9375rem;padding:12px 16px;max-width:200px}
.mm-node.l1{font-weight:650;font-size:.875rem;border-color:var(--ink-3)}
.mm-node.focus{border-color:var(--orange-ink);border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 30%,transparent)}
.mm-node.sel{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.mm-node .tog{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;line-height:1;opacity:.7}
.mm-node.left{flex-direction:row-reverse;text-align:right}
.mm-edge{fill:none;stroke:var(--line-2);stroke-width:1.5}
.mm-new{animation:mmIn .4s var(--ease-out)}
@keyframes mmIn{from{opacity:0;transform:translateY(-50%) scale(.92)}to{opacity:1;transform:translateY(-50%)}}
.tree{list-style:none;padding:8px 0}
.tree ul{list-style:none;margin-left:14px;padding-left:14px;border-left:1px solid var(--line-2)}
.tree li{margin:2px 0}
.tree button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;min-height:44px;font-size:.9375rem}
.tree button:hover{background:var(--bg-2)}
.tree button[aria-selected="true"]{background:var(--blue-50);color:var(--blue-ink)}
.tree .tw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;flex:none}
.tree .leaf .tw{border:0}
.tree .leaf .tw::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3)}

/* flow / stepper */
.flow-rail{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin;padding:18px 18px 4px;scroll-snap-type:x proximity}
.flow-step{flex:1 0 auto;min-width:120px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:0 14px 14px 0;text-align:left;position:relative;scroll-snap-align:start}
.flow-step .dotline{display:flex;align-items:center;width:100%}
.flow-step .dotc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--card);display:grid;place-items:center;font-family:var(--font-mono);font-size:.6875rem;flex:none;transition:background-color .25s,border-color .25s,color .25s}
.flow-step .ln{flex:1;height:1.5px;background:var(--line-2);margin-left:6px;position:relative;overflow:hidden}
.flow-step .ln::after{content:"";position:absolute;inset:0;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease-out)}
.flow-step:last-child .ln{display:none}
.flow-step .lab{font-size:.8125rem;font-weight:600;letter-spacing:.01em;text-transform:uppercase;line-height:1.25;color:var(--ink-3);transition:color .2s;max-width:16ch}
.flow-step:hover .lab{color:var(--ink)}
.flow-step.done .dotc{border-color:var(--blue);color:var(--blue-ink)}
.flow-step.done .ln::after{transform:scaleX(1)}
.flow-step.active .dotc{background:var(--blue);border-color:var(--blue);color:var(--on-accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 20%,transparent)}
.flow-step.active .lab{color:var(--ink)}
.flow-panel{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(16px,3vw,40px);padding:clamp(18px,2.5vw,32px);border-top:1px solid var(--line)}
.flow-panel .fp-n{font-family:var(--font-mono);font-size:.75rem;color:var(--blue-ink);margin-bottom:10px;display:block}
.flow-panel h4{font-size:clamp(1.375rem,1.15rem + .9vw,2rem);letter-spacing:-.025em;line-height:1.1;margin-bottom:.5em}
.flow-panel p{color:var(--ink-2);max-width:56ch}
.flow-panel .fp-side{border-left:1px solid var(--line);padding-left:clamp(16px,2vw,28px)}
.flow-panel .fp-side dl{display:grid;gap:14px;margin:0}
.flow-panel .fp-side dt{font-family:var(--font-mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:4px}
.flow-panel .fp-side dd{margin:0;font-size:.9375rem;line-height:1.5}
.flow-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-top:1px solid var(--line);background:var(--bg-2);gap:10px}
.fp-anim{animation:fpIn .4s var(--ease-out)}
@keyframes fpIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:760px){.flow-panel{grid-template-columns:1fr}.flow-panel .fp-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}}
.adapt-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);align-items:center}

/* tabs */
.tabs [role="tablist"]{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 6px}
.tabs [role="tablist"]::-webkit-scrollbar{display:none}
.tabs [role="tab"]{padding:14px 12px;font-size:.875rem;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px;transition:color .15s,border-color .2s}
.tabs [role="tab"]:hover{color:var(--ink)}
.tabs [role="tab"][aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tabs [role="tabpanel"]{padding:clamp(18px,2.5vw,30px)}
.tabs [role="tabpanel"][hidden]{display:none}

/* problem tree */
.ptree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.ptree .col{padding:18px;border-right:1px solid var(--line)}
.ptree .col:last-child{border-right:0}
.ptree .col h4{font-family:var(--font-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:500;color:var(--ink-3);margin-bottom:12px;display:flex;justify-content:space-between}
.ptree .col h4 span{color:var(--blue-ink)}
.pt-item{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.875rem;line-height:1.35;margin-bottom:8px;min-height:44px;transition:opacity .25s,border-color .2s,background-color .2s}
.pt-item:hover{border-color:var(--ink-3)}
.pt-item.on{border-color:var(--blue);background:var(--blue-50)}
.pt-item.sel{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.pt-item.dim{opacity:.32}
.pt-item .tag{margin-top:8px;height:20px;font-size:.625rem}
.pt-item.sel .tag{background:rgb(255 255 255/.15);color:inherit;border-color:rgb(255 255 255/.4)}
@media (max-width:900px){.ptree{grid-template-columns:1fr 1fr}.ptree .col:nth-child(2){border-right:0}.ptree .col:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:520px){.ptree{grid-template-columns:1fr}.ptree .col{border-right:0;border-bottom:1px solid var(--line)}}

/* BMC */
.bmc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto auto auto;gap:1px;background:var(--line)}
.bmc button{background:var(--card);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:background-color .2s}
.bmc button:hover{background:var(--bg-2)}
.bmc button[aria-pressed="true"]{background:var(--blue-50);box-shadow:inset 0 0 0 2px var(--blue)}
.bmc .bt{font-family:var(--font-mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.bmc .bs{font-size:.8125rem;line-height:1.4;color:var(--ink-2)}
.bmc .kp{grid-column:1/3;grid-row:1/3}.bmc .ka{grid-column:3/5;grid-row:1}.bmc .kr{grid-column:3/5;grid-row:2}
.bmc .vp2{grid-column:5/7;grid-row:1/3}.bmc .cr{grid-column:7/9;grid-row:1}.bmc .ch{grid-column:7/9;grid-row:2}
.bmc .cs{grid-column:9/11;grid-row:1/3}.bmc .co{grid-column:1/6;grid-row:3}.bmc .rs{grid-column:6/11;grid-row:3}
@media (max-width:860px){.bmc{grid-template-columns:1fr 1fr}.bmc>*{grid-column:auto!important;grid-row:auto!important}.bmc .vp2{grid-column:1/-1!important}}

/* service blueprint */
.bp-wrap{overflow-x:auto}
.bp{display:grid;min-width:880px;font-size:.8125rem}
.bp .bp-h,.bp .bp-l,.bp .bp-c{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);line-height:1.4}
.bp .bp-l{font-family:var(--font-mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--bg-2);position:sticky;left:0;z-index:1}
.bp .bp-h{font-weight:600;background:var(--bg-2);text-align:left;font-size:.8125rem;min-height:44px}
.bp .bp-h:hover{color:var(--blue-ink)}
.bp .bp-h[aria-pressed="true"]{background:var(--blue);color:var(--on-accent)}
.bp .bp-c{transition:background-color .2s,opacity .2s;color:var(--ink-2)}
.bp .bp-c.on{background:var(--blue-50);color:var(--ink)}
.bp .line-sep{grid-column:1/-1;font-family:var(--font-mono);font-size:.625rem;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink);padding:3px 12px;background:repeating-linear-gradient(90deg,var(--orange) 0 6px,transparent 6px 10px) bottom/100% 1px no-repeat}
.bp-mobile{display:none}
@media (max-width:760px){.bp-wrap{display:none}.bp-mobile{display:block}}
.bp-stack{display:grid;gap:8px;padding:0 18px 18px}
.bp-stack>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.bp-stack .t-label{display:block;margin-bottom:4px}

/* matrix */
.mx{position:relative;aspect-ratio:1.45/1;margin:28px 28px 44px 52px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);touch-action:none}
.mx::before,.mx::after{content:"";position:absolute;background:var(--line-2)}
.mx::before{left:50%;top:0;bottom:0;width:1px}.mx::after{top:50%;left:0;right:0;height:1px}
.mx-q{position:absolute;font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:8px;max-width:45%}
.mx-ax{position:absolute;font-family:var(--font-mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.mx-ax.x{bottom:-32px;left:0;right:0;display:flex;justify-content:space-between}
.mx-ax.y{left:-40px;top:0;bottom:0;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between}
.mx-pt{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);
  font-size:.75rem;font-weight:600;white-space:nowrap;box-shadow:var(--sh-sm);cursor:grab;z-index:2;min-height:32px;touch-action:none;transition:box-shadow .2s,border-color .2s}
.mx-pt::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--ink-3);flex:none}
.mx-pt.us::before{background:var(--orange)}
.mx-pt.us{border:1.5px dashed var(--orange);background:var(--orange-50);color:var(--orange-ink)}
.mx-pt.active{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent),var(--sh-md);z-index:3}
.mx-pt.drag{cursor:grabbing;box-shadow:var(--sh-lg)}
@media (max-width:600px){.mx{aspect-ratio:1/1.1;margin:20px 12px 40px 40px}.mx-pt{font-size:.6875rem;padding:5px 8px 5px 5px}}

/* swot */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.swot>div{background:var(--card);padding:18px}
.swot h4{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;font-size:1rem}
.swot h4 b{font-family:var(--font-serif);font-weight:400;font-size:2.25rem;line-height:1;color:var(--blue)}
.swot .q-w h4 b,.swot .q-t h4 b{color:var(--orange-ink)}
.swot details{border-top:1px solid var(--line);padding:10px 0}
.swot summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;font-size:.9375rem;font-weight:500;min-height:28px;align-items:center}
.swot summary::-webkit-details-marker{display:none}
.swot summary::after{content:"+";font-family:var(--font-mono);color:var(--ink-3);transition:transform .25s}
.swot details[open] summary::after{transform:rotate(45deg)}
.swot details p{font-size:.875rem;color:var(--ink-2);margin:8px 0 2px}
@media (max-width:640px){.swot{grid-template-columns:1fr}}

/* funnel */
.funnel{display:grid;gap:6px;padding:18px}
.fn-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center}
.fn-bar{height:52px;margin-inline:auto;border-radius:10px;background:var(--blue-50);border:1px solid var(--blue-100);display:flex;align-items:center;justify-content:space-between;padding:0 14px;width:100%;
  text-align:left;font-size:.875rem;font-weight:600;transition:background-color .2s,border-color .2s,color .2s;color:var(--blue-ink)}
.fn-bar:hover{border-color:var(--blue)}
.fn-bar[aria-pressed="true"]{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.fn-bar .conv{font-family:var(--font-mono);font-weight:400;font-size:.75rem;opacity:.8}
.fn-in{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--card);font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:560px){.fn-row{grid-template-columns:minmax(0,1fr) 84px}.fn-bar{width:100%!important}}

/* CRM */
.crm-stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.crm-stats button{background:var(--card);padding:12px 14px;text-align:left;min-height:64px;transition:background-color .15s}
.crm-stats button:hover{background:var(--bg-2)}
.crm-stats button[aria-pressed="true"]{background:var(--blue-50);box-shadow:inset 0 -2px 0 var(--blue)}
.crm-stats .v{font-size:1.5rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;display:block}
.crm-stats .k{font-size:.6875rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
@media (max-width:760px){.crm-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.crm-tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.input,.select,.textarea{height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;background:var(--card);font-size:.875rem;transition:border-color .15s,box-shadow .15s;min-width:0}
.input:hover,.select:hover,.textarea:hover{border-color:var(--ink-3)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.textarea{height:auto;padding:10px 12px;min-height:120px;resize:vertical;line-height:1.5}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.8125rem;min-width:860px}
.tbl th{padding:10px 12px;background:var(--bg-2);border-bottom:1px solid var(--line);text-align:left;font-weight:500;color:var(--ink-3);white-space:nowrap;font-size:.75rem}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td[contenteditable]{border-radius:6px;outline:none}
.tbl td[contenteditable]:hover{background:var(--bg-2)}
.tbl td[contenteditable]:focus{background:var(--blue-50);box-shadow:inset 0 0 0 1.5px var(--blue)}
.tbl .select{height:32px;font-size:.8125rem;padding:0 8px}
.tbl .mono{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-3)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;padding:3px 8px;border-radius:999px;white-space:nowrap}
.row-in{animation:rowIn .4s var(--ease-out)}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-size:.9375rem}

/* timeline */
.tl{position:relative}
.tl-rail{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));position:relative;padding:28px 18px 8px}
.tl-rail::before{content:"";position:absolute;left:18px;right:18px;top:43px;height:1.5px;background:var(--line-2)}
.tl-prog{position:absolute;left:18px;top:43px;height:1.5px;background:var(--blue);transition:width .6s var(--ease-out)}
.tl-pt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding-right:10px;position:relative;z-index:1;min-height:44px}
.tl-pt .d{width:30px;height:30px;border-radius:50%;background:var(--card);border:1.5px solid var(--line-2);display:grid;place-items:center;transition:all .25s}
.tl-pt .d::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3);transition:background-color .25s}
.tl-pt .when{font-family:var(--font-mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.tl-pt .what{font-size:.875rem;font-weight:600;line-height:1.25;max-width:14ch}
.tl-pt.past .d{border-color:var(--blue)} .tl-pt.past .d::after{background:var(--blue)}
.tl-pt.active .d{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 5px color-mix(in srgb,var(--blue) 18%,transparent)} .tl-pt.active .d::after{background:var(--on-accent)}
@media (max-width:760px){
  .tl-rail{grid-template-columns:1fr;gap:4px;padding:18px}
  .tl-rail::before{left:32px;right:auto;top:30px;bottom:30px;width:1.5px;height:auto}
  .tl-prog{display:none}
  .tl-pt{flex-direction:row;align-items:center;gap:14px}
  .tl-pt .when{min-width:0}
  .tl-pt .what{max-width:none}
}

/* graph-ish grids */
.cap-mx{overflow-x:auto}
.cap-tbl{width:100%;border-collapse:collapse;min-width:640px}
.cap-tbl th,.cap-tbl td{border-bottom:1px solid var(--line);padding:0}
.cap-tbl thead th{font-size:.75rem;font-weight:500;color:var(--ink-3);padding:12px;text-align:center;background:var(--bg-2)}
.cap-tbl tbody th{text-align:left;font-weight:600;font-size:.875rem;padding:12px 16px;white-space:nowrap}
.cap-cell{width:100%;height:52px;display:grid;place-items:center;transition:background-color .15s}
.cap-cell:hover{background:var(--bg-2)}
.cap-cell[aria-pressed="true"]{background:var(--blue-50)}
.dot-l{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-3)}
.dot-l.l2{background:var(--blue);border-color:var(--blue)}
.dot-l.l1{background:var(--blue-100);border-color:var(--blue)}
.dot-l.lc{border:1.5px dashed var(--orange-ink);background:var(--orange-50)}

/* objection handler */
.obj{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.obj-list{border-right:1px solid var(--line);padding:10px}
.obj-list button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;font-size:.9375rem;line-height:1.35;min-height:44px;transition:background-color .15s,color .15s}
.obj-list button:hover{background:var(--bg-2)}
.obj-list button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.obj-out{padding:clamp(18px,2.5vw,30px)}
@media (max-width:760px){.obj{grid-template-columns:1fr}.obj-list{border-right:0;border-bottom:1px solid var(--line)}}

/* revenue */
.rev{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:18px}
.rev button{border:1px solid var(--line-2);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:110px;transition:background-color .2s,border-color .2s;background:var(--card)}
.rev button:hover{border-color:var(--ink-3)}
.rev button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-50)}
.rev .chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-3);display:grid;place-items:center;transition:all .2s}
.rev button[aria-pressed="true"] .chk{background:var(--orange-ink);border-color:var(--orange-ink)}
.rev button[aria-pressed="true"] .chk::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
@media (max-width:900px){.rev{grid-template-columns:1fr 1fr}}
.rev-out{padding:0 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rev-out>div{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg-2)}
@media (max-width:700px){.rev-out{grid-template-columns:1fr}}

/* pillars */
.pillar-list{display:grid;gap:8px}
.pillar-list li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9375rem}
.pillar-list li:last-child{border-bottom:0}
.pillar-list li::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px dashed var(--orange-ink);margin-top:.5em;flex:none}

/* products (hydra) */
.prod{border-radius:var(--r-xl);padding:24px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.prod .bottle{width:56px;height:150px;border-radius:14px 14px 10px 10px;border:1.5px solid currentColor;position:relative;margin:30px 0 18px;opacity:.85}
.prod .bottle::before{content:"";position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:22px;height:16px;border:1.5px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0}
.prod .bottle::after{content:"";position:absolute;left:-1.5px;right:-1.5px;top:48px;height:46px;background:currentColor;opacity:.12}

/* DRAFTDIGGER */
.dd-hero{background:var(--ink);color:var(--bg);border-radius:0 0 var(--r-2xl) var(--r-2xl)}
.dd-word{font-weight:800;font-size:clamp(3rem,.4rem + 11.2vw,12.5rem);line-height:.82;letter-spacing:-.055em;text-transform:uppercase}
.dd-word .dig{color:var(--orange)}

/* contact */
.form{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field label{font-size:.875rem;font-weight:500}
.field .help{font-size:.75rem;color:var(--ink-3)}
.field .err{font-size:.75rem;color:#C42B1C;font-weight:500;min-height:1em}
.field .input,.field .select{height:48px;font-size:1rem}
.field .textarea{font-size:1rem}
.field [aria-invalid="true"]{border-color:#C42B1C}
.form-status{padding:14px 16px;border-radius:var(--r);font-size:.9375rem;display:none}
.form-status.show{display:block}
.form-status.ok{background:var(--blue-50);color:var(--blue-ink);border:1px solid var(--blue-100)}
.form-status.bad{background:#FDECEA;color:#8C1D12;border:1px solid #F6C9C3}
@media (max-width:639px){.input,.select,.textarea{font-size:16px}}
.big-email{font-size:clamp(1.4rem,.9rem + 2.6vw,3.25rem);font-weight:650;letter-spacing:-.03em;text-decoration:none;word-break:break-word;line-height:1.1}
.big-email:hover{color:var(--blue)}

/* footer */
.foot{background:var(--ink);color:var(--bg);padding-top:clamp(4rem,3rem + 4vw,7rem);padding-bottom:32px;margin-top:0}
.foot .t-label{color:color-mix(in srgb,var(--bg) 55%,var(--ink))}
.foot a{text-decoration:none;color:color-mix(in srgb,var(--bg) 80%,var(--ink))}
.foot a:hover{color:var(--bg)}
.foot-cta{font-weight:800;font-size:clamp(2.75rem,1rem + 7vw,8rem);line-height:.88;letter-spacing:-.05em;text-transform:uppercase}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px;margin-top:clamp(3rem,2rem + 3vw,5rem);padding-top:32px;border-top:1px solid rgb(255 255 255/.12)}
.foot-grid ul{list-style:none;display:grid;gap:8px;font-size:.9375rem}
.foot-base{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:48px;font-size:.8125rem;color:color-mix(in srgb,var(--bg) 55%,var(--ink))}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr}}
.foot .btn-primary{color:#fff}

/* arch map list */
.arch{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1000px){.arch{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (max-width:860px){.tag{font-size:.75rem;height:26px}}
@media (max-width:1100px){
  .foot-grid ul{gap:0}.foot-grid ul a,.foot-grid ul li{display:block;padding:12px 0}
  .foot a.t-sm,#toTop{display:inline-flex;align-items:center;min-height:44px}
  .brand{min-height:44px}
  .nav-cta .btn{min-height:44px!important}
}
/* reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
  .line-rv{opacity:1;transform:none;filter:none}
  .tag-upcoming,.tag-upcoming::before,.tag-ambition,.tag-ambition::before{animation:none!important}
  .mq-track{animation:none!important;flex-wrap:wrap;width:auto}.mq-row{flex-wrap:wrap}.mq-row+.mq-row{display:none}.mq-btn{display:none}
}
@media print{.nav,.mnav,.foot,.cs-toc,.w-tools{display:none}body{background:#fff}}
</style>
</head>
